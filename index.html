<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ex 01 - Simple Web Server</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 40px;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            max-width: 700px;
            margin: 0 auto;
        }
        h1 {
            color: #003366;
            text-align: center;
        }
        .student-info {
            background: #eef2f7;
            padding: 15px;
            border-left: 5px solid #003366;
            margin-bottom: 25px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #003366;
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>TCP/IP Protocol Suite</h1>
        
        <div class="student-info">
            <p><strong>Name:</strong> MOHAMMED ZAKIR HUSSAIN F</p>
            <p><strong>Register Number:</strong> 26010638</p>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Layer</th>
                    <th>Protocols</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td><strong>Application Layer</strong></td>
                    <td>HTTP, HTTPS, FTP, SMTP, DNS, SSH, Telnet</td>
                </tr>
                <tr>
                    <td><strong>Transport Layer</strong></td>
                    <td>TCP, UDP</td>
                </tr>
                <tr>
                    <td><strong>Internet Layer</strong></td>
                    <td>IP (IPv4/IPv6), ICMP, ARP, IGMP</td>
                </tr>
                <tr>
                    <td><strong>Network Access Layer</strong></td>
                    <td>Ethernet, Wi-Fi (802.11), PPP</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
